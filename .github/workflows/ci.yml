name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mcp ruff

      - name: Lint
        run: ruff check src tests

      - name: Unit tests (macOS server, mocked bridge)
        run: python tests/unit_mac_test.py
